[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market"
version = "0.1.0"
description = "Project 1 simulated exchange. Milestone 2: resting order book."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Michael Washington" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
